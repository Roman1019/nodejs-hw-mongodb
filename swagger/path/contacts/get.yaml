tags:
  - Contacts
summary: Get all Contacts
operationId: getAllContacts
description: Get all Contacts
security:
  - bearerAuth: []
responses:
  '200':
    description: Found contact with id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              $ref: ../../components/schemas/contact.yaml
  '404':
    $ref: ../../components/responses/404.yaml
