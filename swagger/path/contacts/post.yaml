tags:
  - Contacts
summary: Create Contact
operationId: createContacts
description: Create contacts
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - photo
        properties:
          name:
            type: string
            description: Contact name
            example: Mary
          phoneNumber:
            type: string
            description: Contact number
            example: '123456789'
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Create a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created Successfully
            data:
              $ref: ../../components/schemas/contact.yaml
  '404':
    $ref: ../../components/responses/404.yaml
