tags:
  - Contacts
summary: Create Contact
operationId: createContacts
description: Create contacts
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact name
            example: Mary
          phoneNumber:
            type: string
            description: Contact number
            example: '123456789'
          email:
            type: string
            description: Contact email
            example: teacher10@ukr.net
          isFavourite:
            type: boolean
            description: Contact is favourite
            example: true
            default: false
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            example: personal
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Create a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created Successfully
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    description: Bad Request
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Bad Request
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
